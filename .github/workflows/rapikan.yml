name: Rapikan Struktur Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.github/**'

permissions:
  contents: write

jobs:
  rapikan:
    name: Ekstrak ZIP & Rapikan Struktur Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ekstrak Semua File ZIP & Rapikan Struktur Folder
        run: |
          shopt -s nullglob nocaseglob
          ZIP_FILES=(*.zip)
          if [ ${#ZIP_FILES[@]} -eq 0 ]; then
            echo "Tidak ada file .zip di root repository."
            ls -la
          else
            for zf in "${ZIP_FILES[@]}"; do
              echo "Mengekstrak: $zf"
              unzip -o "$zf" -x ".github/*"
              rm -f "$zf"
            done
          fi

          rm -f "rapikan.yml"
          find . -maxdepth 4 \( -name ".DS_Store" -o -name "Thumbs.db" -o -name "*.tmp" -o -name "*.bak" -o -name "*~" \) -delete
          chmod +x gradlew 2>/dev/null || true

      - name: Commit & Push Perubahan Rapi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: ekstrak source code & rapikan struktur repo"
            git push
          else
            echo "Tidak ada perubahan baru untuk di-commit."
          fi
