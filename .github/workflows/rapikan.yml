name: Rapikan Struktur Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.github/**'

permissions:
  contents: write

jobs:
  rapikan:
    name: Ekstrak ZIP & Rapikan Struktur Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ekstrak Source ZIP & Rapikan Struktur Folder
        run: |
          if [ -f "Bloxstrap-Mobile-Source.zip" ]; then
            unzip -o "Bloxstrap-Mobile-Source.zip" -x ".github/*"
            rm -f "Bloxstrap-Mobile-Source.zip"
          fi

          rm -f "rapikan.yml"
          find . -maxdepth 4 \( -name ".DS_Store" -o -name "Thumbs.db" -o -name "*.tmp" -o -name "*.bak" -o -name "*~" \) -delete
          chmod +x gradlew 2>/dev/null || true

      - name: Commit & Push Perubahan Rapi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: ekstrak source code & rapikan struktur repo"
            git push
          else
            echo "Struktur repository sudah rapi."
          fi
