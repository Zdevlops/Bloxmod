name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.github/**'
      - '*.zip'
  workflow_run:
    workflows: ["Rapikan Struktur Repository"]
    types:
      - completed
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Bloxstrap Mobile APK
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Cek Kelengkapan Project Android
        run: |
          if [ ! -f "settings.gradle.kts" ] || [ ! -f "app/build.gradle.kts" ]; then
            echo "Project Android belum terekstrak. Jalankan workflow Rapikan Struktur Repository dulu."
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pastikan Lisensi Android SDK Aktif
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Bloxstrap-Mobile-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
